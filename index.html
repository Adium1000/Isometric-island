<!DOCTYPE html>
<html lang="ro"> <!-- This is my native language but it does not affect project's functionallity -->
<head>
    <meta charset="UTF-8">
    <title>Isometric Island</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">  <!-- This is the title's font from google fonts -->
    <style>
        body {
            margin: 0;
            background: #aad6ff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Press Start 2P', cursive;
            cursor: crosshair;
            user-select: none;
            -webkit-user-select: none;
        }

        .game-title {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            margin: 0;
            z-index: 1000;
            color: #523519;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 0px rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: transform 0.3s ease;
            display: inline-block;
        }

        .game-title:hover {
            transform: translateX(-50%) scale(1.2);
        }

        #stage {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center; 
            margin-bottom: 200px; 
            perspective: 1000px;
        }

        #map {
            position: relative;
            transform: scale(4.0);
            image-rendering: pixelated;
            z-index: 10;
            transform-origin: center center;
            backface-visibility: hidden;
        }

        .tile {
            position: absolute;
            width: 24px;
            height: 24px;
            outline: 0.5px solid transparent; 
            -webkit-user-drag: none;
            filter: drop-shadow(3px 4px 2px rgba(0,0,0,0.20));
            transition: opacity 0.1s;
        }

        .tile:hover { 
            filter: brightness(1.2) drop-shadow(3px 4px 2px rgba(0,0,0,0.3)); 
        }

        #dock-container {
            position: fixed;
            bottom: 20px; width: 100%; height: 60px;
            display: flex; justify-content: center; align-items: center;
            z-index: 100; pointer-events: none;
        }

        #dock {
            position: relative; pointer-events: auto; width: 1200px; height: 100%;
            background: url('./Assets/GUI/hotbar.png') no-repeat center;
            background-size: contain; image-rendering: pixelated;
            display: flex; justify-content: center; align-items: center; gap: 20px;
        }

        .slot { width: 60px; height: 60px; display: flex; justify-content: center; align-items: center; cursor: pointer; z-index: 2; }
        .slot img { width: 35px; height: 35px; image-rendering: pixelated; }

        #selection-highlight {
            position: absolute; width: 60px; height: 60px;
            left: 0; top: 0; 
            background: url('./Assets/GUI/selector.png') no-repeat center;
            background-size: contain; image-rendering: pixelated;
            transition: all 0.2s cubic-bezier(0.18, 0.89, 0.32, 1.28);
            pointer-events: none; z-index: 1; transform: scale(1.2);
        }

        #zoom-ui {
            position: fixed; bottom: 20px; right: 40px; height: 60px;
            display: flex; align-items: center; gap: 10px; z-index: 101;
        }

        .zoom-btn { 
            width: 25px; height: 25px; 
            image-rendering: pixelated; 
            cursor: pointer; 
            transition: transform 0.1s;
        }
        .zoom-btn:active { transform: scale(0.8); }

        #zoom-track {
            position: relative; width: 200px; height: 20px;
            background: url('./Assets/GUI/zoombar.png') no-repeat center;
            background-size: 100% 100%; image-rendering: pixelated; cursor: pointer;
        }

        #zoom-dot {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 25px; height: 25px; background: url('./Assets/GUI/zoomdot.png') no-repeat center;
            background-size: contain; image-rendering: pixelated;
            transition: transform 0.15s ease-out, left 0.1s ease-out;
            pointer-events: none;
        }

        #zoom-track:hover #zoom-dot {
            transform: translate(-50%, -50%) scale(1.2);
        }
    </style>
</head>
<body>

<h1 class="game-title">Isometric Island</h1>

<div id="stage">
    <div id="map"></div>
</div>

<div id="dock-container">
    <div id="dock">
        <div id="selection-highlight"></div>
        <div class="slot" onclick="selectBlock('eraser', this)"><img src="./Assets/Blocks/eraser.png"></div>
        <div class="slot" onclick="selectBlock('dirt', this)"><img src="./Assets/Blocks/dirt.png"></div>
        <div class="slot" onclick="selectBlock('flovers', this)"><img src="./Assets/Blocks/flovers.png"></div>
        <div class="slot" onclick="selectBlock('rock', this)"><img src="./Assets/Blocks/rock.png"></div>
        <div class="slot" onclick="selectBlock('dirt2', this)"><img src="./Assets/Blocks/dirt2.png"></div>
        <div class="slot" onclick="selectBlock('crops', this)"><img src="./Assets/Blocks/crops.png"></div>
        <div class="slot" onclick="selectBlock('stone', this)"><img src="./Assets/Blocks/stone.png"></div>
        <div class="slot" onclick="selectBlock('water', this)"><img src="./Assets/Blocks/water.png"></div>
        <div class="slot" onclick="selectBlock('tree', this)"><img src="./Assets/Blocks/tree.png"></div>
    </div>
</div>

<div id="zoom-ui">
    <img src="./Assets/GUI/zoom-.png" class="zoom-btn" id="btn-zoom-out">
    <div id="zoom-track"><div id="zoom-dot"></div></div>
    <img src="./Assets/GUI/zoom+.png" class="zoom-btn" id="btn-zoom-in">
</div>

<script>
    const TILE_W = 24; 
    const TILE_H = 12; 
    let selectedBlockType = 'eraser';
    let treeCounter = 0; 

    // Zoom State
    let currentZoomPercent = 0.43;
    let zoomInterval = null;

    const placeSound = new Audio('./Assets/Audio/place.wav');
    const hotbarSound = new Audio('./Assets/Audio/hotbar.wav');
    const mapContainer = document.getElementById("map");
    const map = document.getElementById('map');
    const highlight = document.getElementById("selection-highlight");
    const zoomTrack = document.getElementById('zoom-track');
    const zoomDot = document.getElementById('zoom-dot');

    window.addEventListener('mousedown', () => {
        placeSound.load();
        hotbarSound.load();
    }, { once: true });

    function selectBlock(type, el, skipSound = false) {
        selectedBlockType = type;
        highlight.style.left = el.offsetLeft + "px";
        highlight.style.top = el.offsetTop + "px";
        if (!skipSound) {
            hotbarSound.currentTime = 0;
            hotbarSound.play().catch(e => {});
        }
    }

    function createTile(x, y, z, type) {
        const img = document.createElement("img");
        img.src = `./Assets/Blocks/${type}.png`;
        img.className = "tile";
        img.style.left = (x - y) * (TILE_W / 2) + "px";
        img.style.top  = (x + y) * (TILE_H / 2) - (z * TILE_H) + "px";
        img.style.zIndex = (x + y) + z;
        
        img.onmousedown = (e) => { 
            e.preventDefault(); 
            handleInteraction(img, x, y, z); 
        };
        mapContainer.appendChild(img);
        return img;
    }

    function handleInteraction(tile, x, y, z) {
        const isPartOfTree = tile.hasAttribute('data-tree-id') && tile.getAttribute('data-tree-id') !== "";

        if (isPartOfTree && selectedBlockType !== 'eraser') return; 

        if (selectedBlockType === 'eraser') {
            const treeId = tile.getAttribute('data-tree-id');
            if (treeId) {
                document.querySelectorAll(`[data-tree-id="${treeId}"]`).forEach(el => el.remove());
            } else {
                tile.style.opacity = "0";
            }
        } else if (selectedBlockType === 'tree') {
            if(tile.style.opacity === "0") return;
            treeCounter++;
            const currentId = "tree_" + treeCounter;
            for(let i=1; i<=3; i++) createTile(x, y, i, 'wood').setAttribute('data-tree-id', currentId);
            for(let ox=-1; ox<=1; ox++) {
                for(let oy=-1; oy<=1; oy++) createTile(x + ox, y + oy, 4, 'leaf').setAttribute('data-tree-id', currentId);
            }
            [{dx:0, dy:0}, {dx:1, dy:0}, {dx:-1, dy:0}, {dx:0, dy:1}, {dx:0, dy:-1}].forEach(l => {
                createTile(x + l.dx, y + l.dy, 5, 'leaf').setAttribute('data-tree-id', currentId);
            });
            createTile(x, y, 6, 'leaf').setAttribute('data-tree-id', currentId);
        } else {
            tile.src = `./Assets/Blocks/${selectedBlockType}.png`;
            tile.style.opacity = "1";
            tile.removeAttribute('data-tree-id');
        }
        placeSound.currentTime = 0; 
        placeSound.play().catch(e => {});
    }

    // Initialize Map
    for(let y=0; y<8; y++) for(let x=0; x<8; x++) createTile(x, y, 0, 'dirt');

    function applyZoom() {
        zoomDot.style.left = (currentZoomPercent * 100) + "%";
        const scale = (1 + currentZoomPercent * 7).toFixed(2);
        const yMove = (currentZoomPercent * -50).toFixed(2);
        map.style.transform = `scale(${scale}) translateY(${yMove}px)`;
    }

    zoomTrack.addEventListener('mousedown', (e) => {
        const updateSlider = (ev) => {
            const rect = zoomTrack.getBoundingClientRect();
            currentZoomPercent = Math.max(0, Math.min(1, (ev.clientX - rect.left) / rect.width));
            applyZoom();
        };
        updateSlider(e);
        const onMove = ev => updateSlider(ev);
        const onUp = () => window.removeEventListener('mousemove', onMove);
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onUp);
    });

    function startZooming(delta) {
        currentZoomPercent = Math.max(0, Math.min(1, currentZoomPercent + delta));
        applyZoom();
        zoomInterval = setInterval(() => {
            currentZoomPercent = Math.max(0, Math.min(1, currentZoomPercent + delta));
            applyZoom();
        }, 50);
    }

    function stopZooming() {
        clearInterval(zoomInterval);
    }

    document.getElementById('btn-zoom-in').addEventListener('mousedown', () => startZooming(0.02));
    document.getElementById('btn-zoom-out').addEventListener('mousedown', () => startZooming(-0.02));
    window.addEventListener('mouseup', stopZooming);

    window.onload = () => {
        applyZoom();
        const firstSlot = document.querySelector('.slot');
        if (firstSlot) selectBlock('eraser', firstSlot, true);
    };
</script>
</body>
</html>
