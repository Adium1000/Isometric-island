<!-- Isometric island HTML Source code 21.02.26 BUILD 2 -->
<!DOCTYPE html>
<html lang="ro"> <!-- This is my native language but it does not affect project's functionallity -->
<head>
    <meta charset="UTF-8">
    <title>Isometric Island</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">  <!-- This is the title's font from google fonts -->
     <style>
        body {
            margin: 0;
            background: #aad6ff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Press Start 2P', cursive;
            cursor: crosshair;
            user-select: none;
            -webkit-user-select: none;
        }

        .game-title-container {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            text-align: center;
        }

        .game-title {
            margin: 0;
            color: #523519;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 0px rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: transform 0.3s ease;
            display: inline-block;
        }

        #splash-text {
            position: absolute;
            top: 20px;
            right: -60px;
            color: #ffff00;
            font-size: 10px;
            text-shadow: 2px 2px #3f3f00;
            transform: rotate(-20deg);
            animation: splashBounce 0.5s infinite alternate;
            pointer-events: none;
            white-space: nowrap;
        }

        @keyframes splashBounce {
            from { transform: rotate(-20deg) scale(1); }
            to { transform: rotate(-20deg) scale(1.1); }
        }

        .game-title:hover { transform: scale(1.2); }

        #stage {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center; 
            margin-bottom: 200px; 
            perspective: 1000px;
        }

        #map {
            position: relative;
            transform: scale(4.0);
            image-rendering: pixelated;
            z-index: 10;
            transform-origin: center center;
            backface-visibility: hidden;
        }

        @keyframes islandFloat {
            0% { transform: scale(var(--zoom-scale)) translate(var(--pan-x), calc(var(--y-offset) + var(--pan-y))); }
            50% { transform: scale(var(--zoom-scale)) translate(var(--pan-x), calc(var(--y-offset) - 15px + var(--pan-y))); }
            100% { transform: scale(var(--zoom-scale)) translate(var(--pan-x), calc(var(--y-offset) + var(--pan-y))); }
        }

        .floating-island { animation: islandFloat 3s ease-in-out infinite; }

        .tile {
            position: absolute;
            width: 24px;
            height: 24px;
            outline: 0.5px solid transparent; 
            -webkit-user-drag: none;
            filter: drop-shadow(3px 4px 2px rgba(0,0,0,0.20));
            transition: opacity 0.1s;
        }

        .tile:hover { filter: brightness(1.2) drop-shadow(3px 4px 2px rgba(0,0,0,0.3)); }

        #dock-container {
            position: fixed;
            bottom: 20px; 
            width: 100%; 
            height: 60px; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            z-index: 100; 
            pointer-events: none;
        }

        #dock {
            position: relative; 
            pointer-events: auto; 
            width: 1200px; 
            height: 100%;
            background: url('./Assets/GUI/hotbar.png') no-repeat center;
            background-size: contain; 
            image-rendering: pixelated;
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 15px; 
        }

        #block-name-display {
            position: absolute;
            top: -40px;
            left: 50%;
            transform: translateX(-50%);
            color: #523519;
            font-size: 12px;
            text-shadow: 1px 1px 0px rgba(255, 255, 255, 0.5);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            text-transform: uppercase;
        }

        .slot { 
            width: 60px; 
            height: 60px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            cursor: pointer; 
            z-index: 2; 
        }
        
        .slot img { 
            width: 34px; 
            height: 34px; 
            image-rendering: pixelated; 
        }

        .page-2 { display: none; }

        #music-toggle, #float-toggle {
            position: absolute;
            width: 60px;
            height: 60px;
            cursor: pointer;
            image-rendering: pixelated;
            z-index: 5;
            transition: transform 0.1s ease, filter 0.1s ease;
        }

        #music-toggle { left: -75px; }
        #float-toggle { left: -145px; }

        #music-toggle:hover, #float-toggle:hover { transform: scale(1.1); filter: brightness(1.1); }
        #music-toggle:active, #float-toggle:active { transform: scale(0.9); }

        #selection-highlight {
            position: absolute; 
            width: 60px; 
            height: 60px;
            left: 0; 
            top: 0; 
            background: url('./Assets/GUI/selector.png') no-repeat center;
            background-size: contain; 
            image-rendering: pixelated;
            transition: all 0.2s cubic-bezier(0.18, 0.89, 0.32, 1.28);
            pointer-events: none; 
            z-index: 1; 
            transform: scale(1.1);
        }

        #zoom-ui {
            position: fixed; 
            bottom: 20px; 
            right: 40px; 
            height: 60px;
            display: flex; 
            align-items: center; 
            gap: 10px; 
            z-index: 101;
        }

        .zoom-btn { 
            width: 25px; 
            height: 25px; 
            image-rendering: pixelated; 
            cursor: pointer; 
            transition: transform 0.1s ease, opacity 0.2s ease;
        }
        .zoom-btn:active { transform: scale(0.8); }

        #zoom-track {
            position: relative; 
            width: 200px; 
            height: 20px;
            background: url('./Assets/GUI/zoombar.png') no-repeat center;
            background-size: 100% 100%; 
            image-rendering: pixelated; 
            cursor: pointer;
        }

        #zoom-dot {
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%);
            width: 25px; 
            height: 25px; 
            background: url('./Assets/GUI/zoomdot.png') no-repeat center;
            background-size: contain; 
            image-rendering: pixelated;
            transition: transform 0.15s ease-out, left 0.1s ease-out;
            pointer-events: auto;
        }

        #zoom-dot:hover {
            transform: translate(-50%, -50%) scale(1.2);
            cursor: grab;
        }
    </style>
</head>
<body>

<div class="game-title-container">
    <h1 class="game-title">Isometric Island</h1>
    <div id="splash-text">relaxing</div>
</div>

<div id="stage">
    <div id="map"></div>
</div>

<div id="dock-container">
    <div id="dock">
        <div id="block-name-display">Eraser</div>
        <img id="float-toggle" src="./Assets/GUI/floatoff.png" onclick="toggleFloat()">
        <img id="music-toggle" src="./Assets/GUI/bgoff.png" onclick="toggleMusic()">
        
        <div id="selection-highlight"></div>
        
        <div class="slot page-1" id="slot-eraser" onmouseover="showName('Eraser: Good for shaping and removing blocks ')" onmouseout="hideName()" onclick="selectBlock('eraser', this)"><img src="./Assets/Blocks/eraser.png"></div>
        <div class="slot page-1" onmouseover="showName('Grass: Natural block')" onmouseout="hideName()" onclick="selectBlock('dirt', this)"><img src="./Assets/Blocks/dirt.png"></div>
        <div class="slot page-1" onmouseover="showName('Flowers: Natural Decoration')" onmouseout="hideName()" onclick="selectBlock('flovers', this)"><img src="./Assets/Blocks/flovers.png"></div>
        <div class="slot page-1" onmouseover="showName('Rock: Natural Decoration')" onmouseout="hideName()" onclick="selectBlock('rock', this)"><img src="./Assets/Blocks/rock.png"></div>
        <div class="slot page-1" onmouseover="showName('Dirt: Natural block')" onmouseout="hideName()" onclick="selectBlock('dirt2', this)"><img src="./Assets/Blocks/dirt2.png"></div>
        <div class="slot page-1" onmouseover="showName('Crops: Natural Decoration')" onmouseout="hideName()" onclick="selectBlock('crops', this)"><img src="./Assets/Blocks/crops.png"></div>
        <div class="slot page-1" onmouseover="showName('Stone: Natural block')" onmouseout="hideName()" onclick="selectBlock('stone', this)"><img src="./Assets/Blocks/stone.png"></div>
        <div class="slot page-1" onmouseover="showName('Mossy Stone: Natural Decoration')" onmouseout="hideName()" onclick="selectBlock('mossystone', this)"><img src="./Assets/Blocks/mossystone.png"></div>
        <div class="slot page-1" onmouseover="showName('Sand: Natural block')" onmouseout="hideName()" onclick="selectBlock('sand', this)"><img src="./Assets/Blocks/sand.png"></div>
        <div class="slot page-1" onmouseover="showName('Red Sand: Natural block')" onmouseout="hideName()" onclick="selectBlock('redsand', this)"><img src="./Assets/Blocks/redsand.png"></div>
        <div class="slot page-1" onmouseover="showName('Watermelon: Natural Decoration (multilayer)')" onmouseout="hideName()" onclick="selectBlock('melon', this)"><img src="./Assets/Blocks/melon.png"></div>
        <div class="slot page-1" onmouseover="showName('Haystack: Natural Decoration (multilayer)')" onmouseout="hideName()" onclick="selectBlock('Hay', this)"><img src="./Assets/Blocks/Hay.png"></div>
        <div class="slot page-1" onmouseover="showName('Water: Natural block')" onmouseout="hideName()" onclick="selectBlock('water', this)"><img src="./Assets/Blocks/water.png"></div>
        <div class="slot page-1" onmouseover="showName('Tree: Natural Decoration (multilayer)')" onmouseout="hideName()" onclick="selectBlock('tree', this)"><img src="./Assets/Blocks/tree.png"></div>
        <div class="slot page-1" id="btn-next-page" onclick="switchPage(2)"><img src="./Assets/Blocks/p2.png"></div>

        <div class="slot page-2" id="btn-prev-page" onclick="switchPage(1)"><img src="./Assets/Blocks/p1.png"></div>
        <div class="slot page-2" onmouseover="showName('Pumpkin: Natural Decoration')" onmouseout="hideName()" onclick="selectBlock('pumpkin', this)"><img src="./Assets/Blocks/pumpkin.png"></div>
        <div class="slot page-2" onmouseover="showName('Snow: Natural block ')" onmouseout="hideName()" onclick="selectBlock('snow', this)"><img src="./Assets/Blocks/snow.png"></div>
        <div class="slot page-2" onmouseover="showName('Snow Rocks: Natural block')" onmouseout="hideName()" onclick="selectBlock('snowrocks', this)"><img src="./Assets/Blocks/snowrocks.png"></div>
        <div class="slot page-2" onmouseover="showName('Ice: Natural block')" onmouseout="hideName()" onclick="selectBlock('ice', this)"><img src="./Assets/Blocks/ice.png"></div>
        <div class="slot page-2" onmouseover="showName('Snowman: Human Made decoration (multilayer)')" onmouseout="hideName()" onclick="selectBlock('snowman', this)"><img src="./Assets/Blocks/snowman.png"></div>
        <div class="slot page-2" onmouseover="showName('Snowy Tree: Winter Decoration (multilayer)')" onmouseout="hideName()" onclick="selectBlock('snowed_tree', this)"><img src="./Assets/Blocks/snowedtree.png"></div>
    </div>
</div>

<div id="zoom-ui">
    <img src="./Assets/GUI/zoom-.png" class="zoom-btn" id="btn-zoom-out">
    <div id="zoom-track"><div id="zoom-dot"></div></div>
    <img src="./Assets/GUI/zoom+.png" class="zoom-btn" id="btn-zoom-in">
</div>

<script>
    const TILE_W = 24; 
    const TILE_H = 12; 
    let selectedBlockType = 'eraser';
    let treeCounter = 0; 
    let currentZoomPercent = 0.43; 
    let zoomInterval = null;
    let isFloating = false;
    let currentPage = 1;

    let panX = 0, panY = 0;
    let isPanning = false;
    let startPanX = 0, startPanY = 0;

    let lastSelectedSlotP1 = null;
    let lastSelectedSlotP2 = null;

    const splashes = ["amazing!", "wooooow!", "relaxing", "pixel art!", "isometric!", "build it!" , "Adrian"];
    const splashEl = document.getElementById('splash-text');
    splashEl.innerText = splashes[Math.floor(Math.random() * splashes.length)];

    const nameDisplay = document.getElementById('block-name-display');
    function showName(name) { nameDisplay.innerText = name; nameDisplay.style.opacity = "1"; }
    function hideName() { nameDisplay.style.opacity = "0"; }

    const placeSound = new Audio('./Assets/Audio/place.wav');
    const hotbarSound = new Audio('./Assets/Audio/hotbar.wav');
    const bgMusic = new Audio('./Assets/Audio/BG.wav');
    bgMusic.loop = true;
    let isMusicPlaying = true;

    const mapContainer = document.getElementById("map");
    const map = document.getElementById('map');
    const highlight = document.getElementById("selection-highlight");
    const zoomTrack = document.getElementById('zoom-track');
    const zoomDot = document.getElementById('zoom-dot');
    const musicBtn = document.getElementById('music-toggle');
    const floatBtn = document.getElementById('float-toggle');

    window.addEventListener('keydown', (e) => {
        const key = e.key.toLowerCase();
        if (key === 'e') {
            if (currentPage !== 1) switchPage(1);
            const eraserSlot = document.getElementById('slot-eraser');
            selectBlock('eraser', eraserSlot);
        } 
        else if (key === 'p') {
            switchPage(currentPage === 1 ? 2 : 1);
        } 
        else if (key === 'm') {
            toggleMusic();
        } 
        else if (key === 'f') {
            toggleFloat();
        }
    });

    function playMusic() { bgMusic.play().catch(e => {}); }
    window.addEventListener('mousedown', () => { if (isMusicPlaying) playMusic(); }, { once: true });

    function toggleMusic() {
        isMusicPlaying = !isMusicPlaying;
        musicBtn.src = isMusicPlaying ? "./Assets/GUI/bgoff.png" : "./Assets/GUI/bgon.png";
        if (isMusicPlaying) bgMusic.play(); else bgMusic.pause();
    }

    function toggleFloat() {
        isFloating = !isFloating;
        map.classList.toggle('floating-island', isFloating);
        floatBtn.src = isFloating ? "./Assets/GUI/floaton.png" : "./Assets/GUI/floatoff.png";
        applyZoom();
    }

    function switchPage(pageNum) {
        currentPage = pageNum;
        const p1 = document.querySelectorAll('.page-1');
        const p2 = document.querySelectorAll('.page-2');
        if (pageNum === 2) {
            p1.forEach(el => el.style.display = 'none');
            p2.forEach(el => el.style.display = 'flex');
            if(lastSelectedSlotP2) selectBlock(lastSelectedSlotP2.dataset.type, lastSelectedSlotP2, true);
            else highlight.style.opacity = "0";
        } else {
            p1.forEach(el => el.style.display = 'flex');
            p2.forEach(el => el.style.display = 'none');
            if(lastSelectedSlotP1) selectBlock(lastSelectedSlotP1.dataset.type, lastSelectedSlotP1, true);
        }
        hotbarSound.currentTime = 0; hotbarSound.play().catch(e => {});
    }

    function selectBlock(type, el, skipSound = false) {
        if (!el || el.id === 'btn-next-page' || el.id === 'btn-prev-page') return;
        selectedBlockType = type;
        el.dataset.type = type;
        if(currentPage === 1) lastSelectedSlotP1 = el; else lastSelectedSlotP2 = el;
        highlight.style.left = el.offsetLeft + "px";
        highlight.style.top = el.offsetTop + "px";
        highlight.style.opacity = "1";
        if (!skipSound) { hotbarSound.currentTime = 0; hotbarSound.play().catch(e => {}); }
    }

    function createTile(x, y, z, type, customPath = null) {
        const img = document.createElement("img");
        img.src = customPath ? customPath : `./Assets/Blocks/${type}.png`;
        img.className = "tile";
        img.setAttribute('data-x', x);
        img.setAttribute('data-y', y);
        img.setAttribute('data-z', z);
        img.style.left = (x - y) * (TILE_W / 2) + "px";
        img.style.top  = (x + y) * (TILE_H / 2) - (z * TILE_H) + "px";
        img.style.zIndex = (x + y) + z;
        img.onmousedown = (e) => { 
            if (e.button === 1) return; 
            e.preventDefault(); 
            handleInteraction(img, x, y, z); 
        };
        mapContainer.appendChild(img);
        return img;
    }

    function handleInteraction(tile, x, y, z) {
        const isPartOfObject = tile.hasAttribute('data-obj-id') && tile.getAttribute('data-obj-id') !== "";
        const existingAbove = document.querySelector(`.tile[data-x="${x}"][data-y="${y}"][data-z="${z + 1}"]`);

        if (selectedBlockType === 'eraser') {
            const objId = tile.getAttribute('data-obj-id');
            if (objId) {
                document.querySelectorAll(`[data-obj-id="${objId}"]`).forEach(el => el.remove());
            } else {
                tile.style.opacity = "0";
            }
        } 
        // Logica extinsă pentru snowed_tree
        else if (['tree', 'snowed_tree', 'melon', 'Hay', 'snowman', 'pumpkin'].includes(selectedBlockType)) {
            if(tile.style.opacity === "0" || isPartOfObject || existingAbove) return;
            treeCounter++;
            const currentId = "obj_" + treeCounter;
            
            if (selectedBlockType === 'tree' || selectedBlockType === 'snowed_tree') {
                const leafType = selectedBlockType === 'tree' ? 'leaf' : 'snow2';
                // Trunchi
                for(let i=1; i<=3; i++) createTile(x, y, i, 'wood').setAttribute('data-obj-id', currentId);
                // Strat frunze/zăpadă 1
                for(let ox=-1; ox<=1; ox++) for(let oy=-1; oy<=1; oy++) createTile(x + ox, y + oy, 4, leafType).setAttribute('data-obj-id', currentId);
                // Strat frunze/zăpadă 2
                [{dx:0,dy:0},{dx:1,dy:0},{dx:-1,dy:0},{dx:0,dy:1},{dx:0,dy:-1}].forEach(l => createTile(x+l.dx, y+l.dy, 5, leafType).setAttribute('data-obj-id', currentId));
                // Vârf
                createTile(x, y, 6, leafType).setAttribute('data-obj-id', currentId);
                
                // Efecte (doar dacă e copac normal, sau poți lăsa și la cel de zăpadă)
                if(selectedBlockType === 'tree') startInfiniteLeaves(x, y, currentId);
            } 
            else if (selectedBlockType === 'snowman') {
                createTile(x, y, z + 1, '', './Assets/Blocks/Snowman/snowmanb1.png').setAttribute('data-obj-id', currentId);
                createTile(x, y, z + 2, '', './Assets/Blocks/Snowman/snowmanb2.png').setAttribute('data-obj-id', currentId);
                createTile(x, y, z + 3, '', './Assets/Blocks/Snowman/SnowmanHead.png').setAttribute('data-obj-id', currentId);
            } else {
                createTile(x, y, z + 1, selectedBlockType).setAttribute('data-obj-id', currentId);
            }
        } else {
            if(isPartOfObject) return;
            tile.src = `./Assets/Blocks/${selectedBlockType}.png`;
            tile.style.opacity = "1";
            tile.removeAttribute('data-obj-id');
        }
        placeSound.currentTime = 0; placeSound.play().catch(e => {});
    }

    // Funcțiile rămase (falling leaves etc.) nu s-au schimbat
    function createFallingLeaf(startX, startY, objId) {
        if (!document.querySelector(`[data-obj-id="${objId}"]`)) return;
        const leaf = document.createElement("img");
        const types = ['falling leaf1.png', 'falling leaf2.png', 'falling leaf3.png'];
        const randomType = types[Math.floor(Math.random() * types.length)];
        leaf.src = `./Assets/Blocks/${randomType}`;
        leaf.className = "tile";
        leaf.style.pointerEvents = "none";
        leaf.style.zIndex = "1000";
        leaf.style.transform = "scale(0.5)"; 
        leaf.style.transition = "opacity 1.5s ease-out"; 
        mapContainer.appendChild(leaf);
        let curX = startX + (Math.random() * 1.6 - 0.8);
        let curY = startY + (Math.random() * 1.6 - 0.8);
        let curZ = 5 + Math.random(); 
        let angle = Math.random() * Math.PI * 2;
        let speed = 0.015 + Math.random() * 0.02;
        function animate() {
            curZ -= speed; angle += 0.03;
            let driftX = curX + Math.sin(angle) * 0.5;
            let driftY = curY + Math.cos(angle) * 0.5;
            leaf.style.left = (driftX - driftY) * (TILE_W / 2) + "px";
            leaf.style.top = (driftX + driftY) * (TILE_H / 2) - (curZ * TILE_H) + "px";
            if (curZ <= 0.05) {
                leaf.style.opacity = "0";
                setTimeout(() => leaf.remove(), 1500);
                return;
            }
            requestAnimationFrame(animate);
        }
        animate();
    }

    function startInfiniteLeaves(x, y, objId) {
        const interval = setInterval(() => {
            if (!document.querySelector(`[data-obj-id="${objId}"]`)) { clearInterval(interval); return; }
            if (Math.random() > 0.6) {
                const burst = Math.floor(Math.random() * 3) + 1;
                for(let i=0; i<burst; i++) { setTimeout(() => createFallingLeaf(x, y, objId), i * 500); }
            }
        }, 3000 + Math.random() * 4000);
    }

    for(let y=0; y<8; y++) for(let x=0; x<8; x++) createTile(x, y, 0, 'dirt');
    
    function applyZoom() {
        zoomDot.style.left = (currentZoomPercent * 100) + "%";
        const scale = (1 + currentZoomPercent * 7).toFixed(2);
        const yMove = (currentZoomPercent * -50).toFixed(2);
        map.style.setProperty('--zoom-scale', scale);
        map.style.setProperty('--y-offset', yMove + "px");
        map.style.setProperty('--pan-x', panX + "px");
        map.style.setProperty('--pan-y', panY + "px");
        if (!isFloating) map.style.transform = `scale(${scale}) translate(${panX}px, calc(${yMove}px + ${panY}px))`;
    }

    function updateSlider(clientX) {
        const rect = zoomTrack.getBoundingClientRect();
        currentZoomPercent = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
        applyZoom();
    }

    zoomTrack.addEventListener('mousedown', (e) => {
        updateSlider(e.clientX);
        const onMove = ev => updateSlider(ev.clientX);
        const onUp = () => { window.removeEventListener('mousemove', onMove); window.removeEventListener('mouseup', onUp); };
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onUp);
    });

    window.addEventListener('mousedown', (e) => {
        if (e.button === 1) {
            isPanning = true; document.body.style.cursor = 'grabbing';
            startPanX = e.clientX - panX; startPanY = e.clientY - panY;
            e.preventDefault();
        }
    });

    window.addEventListener('mousemove', (e) => {
        if (isPanning) { panX = e.clientX - startPanX; panY = e.clientY - startPanY; applyZoom(); }
    });

    window.addEventListener('mouseup', (e) => { 
        if (e.button === 1 || isPanning) { isPanning = false; document.body.style.cursor = 'crosshair'; }
    });

    function startZooming(delta) {
        if(zoomInterval) clearInterval(zoomInterval);
        const tick = () => { currentZoomPercent = Math.max(0, Math.min(1, currentZoomPercent + delta)); applyZoom(); };
        tick(); zoomInterval = setInterval(tick, 50);
    }

    document.getElementById('btn-zoom-in').addEventListener('mousedown', () => startZooming(0.02));
    document.getElementById('btn-zoom-out').addEventListener('mousedown', () => startZooming(-0.02));
    window.addEventListener('mouseup', () => clearInterval(zoomInterval));

    window.onload = () => {
        applyZoom();
        const firstSlot = document.getElementById('slot-eraser');
        lastSelectedSlotP1 = firstSlot;
        selectBlock('eraser', firstSlot, true);
    };
</script>
</body>
</html>
