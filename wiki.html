<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Isometric Island:Wiki</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet"/>
<style>
:root {
  --gui-bg:       #8b5e34;
  --gui-bg-dark:  #3b2007;
  --gui-border:   #523519;
  --gui-accent:   #ffdf80;
  --gui-text:     #fff8e1;
  --gui-text-dim: #a07850;
  --sky:          #aad6ff;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Press Start 2P', cursive;
  background: var(--sky);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow-x: hidden;
}
.header-fade {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 15;
  pointer-events: none;
  height: 220px;
  background: linear-gradient(to bottom, #aad6ff 0%, #aad6ff 62%, rgba(170,214,255,0) 100%);
  opacity: 0;
  transition: opacity 0.3s ease;
}
.header-fade.visible { opacity: 1; }
.clouds { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
.cloud { position: absolute; background: #fff; image-rendering: pixelated; opacity: 0.85; }
.cloud::before, .cloud::after { content: ''; position: absolute; background: #fff; }
.c1 { width:48px;height:16px; top:12%; left:-60px; animation: drift 28s linear infinite; }
.c1::before { width:24px;height:16px; top:-16px; left:8px; }
.c1::after  { width:16px;height:8px;  top:-8px;  left:24px; }
.c2 { width:64px;height:16px; top:28%; left:-80px; animation: drift 36s linear infinite 6s; }
.c2::before { width:32px;height:16px; top:-16px; left:12px; }
.c2::after  { width:20px;height:8px;  top:-8px;  left:32px; }
.c3 { width:40px;height:12px; top:55%; left:-50px; animation: drift 22s linear infinite 12s; }
.c3::before { width:20px;height:12px; top:-12px; left:6px; }
.c4 { width:56px;height:16px; top:72%; left:-70px; animation: drift 32s linear infinite 3s; }
.c4::before { width:28px;height:16px; top:-16px; left:10px; }
.c4::after  { width:16px;height:8px;  top:-8px;  left:28px; }
@keyframes drift {
  from { transform: translateX(0); }
  to   { transform: translateX(calc(100vw + 120px)); }
}
.top-header {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 20;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  padding-top: 16px;
}
.logo-row { display: flex; align-items: center; justify-content: center; gap: 14px; }
.game-icon { width: 48px; height: 48px; image-rendering: pixelated; }
.title {
  color: #523519;
  font-size: clamp(10px, 3vw, 16px);
  text-shadow: 2px 2px 0 #fff8e1, 4px 4px 0 rgba(0,0,0,0.18);
  letter-spacing: 1px;
  line-height: 2;
}
.nav-bar {
  display: flex;
  align-items: center;
  background: var(--gui-bg);
  border: 3px solid var(--gui-border);
  box-shadow: 4px 4px 0 var(--gui-bg-dark);
  clip-path: polygon(0% 6px,6px 6px,6px 0%,calc(100% - 6px) 0%,calc(100% - 6px) 6px,100% 6px,100% calc(100% - 6px),calc(100% - 6px) calc(100% - 6px),calc(100% - 6px) 100%,6px 100%,6px calc(100% - 6px),0% calc(100% - 6px));
}
.nav-btn {
  font-family: 'Press Start 2P', cursive;
  font-size: 9px;
  padding: 14px 22px;
  background: transparent;
  border: none;
  border-right: 3px solid var(--gui-border);
  color: var(--gui-text-dim);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  text-decoration: none;
  white-space: nowrap;
  letter-spacing: 0.5px;
  transition: background 0.1s, color 0.1s;
}
.nav-btn:last-child { border-right: none; }
.nav-btn:hover { background: var(--gui-bg-dark); color: var(--gui-accent); }
.nav-btn:active { transform: translateY(1px); }
.nav-btn-active { background: var(--gui-bg-dark); color: #fff8e1; cursor: default; }
.nav-icon { width: 18px; height: 18px; image-rendering: pixelated; vertical-align: middle; flex-shrink: 0; }
.nav-label { display: inline; }

.wiki-layout {
  position: relative;
  z-index: 10;
  width: min(860px, 94vw);
  margin-top: 150px;
  margin-bottom: 48px;
  animation: popIn 0.4s cubic-bezier(0.18,0.89,0.32,1.28) both;
}
@keyframes popIn {
  from { transform: scale(0.93) translateY(20px); opacity: 0; }
  to   { transform: scale(1) translateY(0); opacity: 1; }
}
.wiki-page {
  background: var(--gui-bg);
  border: 4px solid var(--gui-border);
  box-shadow: 10px 10px 0 var(--gui-bg-dark);
  clip-path: polygon(0% 12px,12px 12px,12px 0%,calc(100% - 12px) 0%,calc(100% - 12px) 12px,100% 12px,100% calc(100% - 12px),calc(100% - 12px) calc(100% - 12px),calc(100% - 12px) 100%,12px 100%,12px calc(100% - 12px),0% calc(100% - 12px));
}
.wiki-title-bar {
  background: var(--gui-bg-dark);
  border-bottom: 3px solid var(--gui-border);
  padding: 12px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.wiki-title-bar span { color: var(--gui-accent); font-size: 9px; text-shadow: 2px 2px var(--gui-border); letter-spacing: 1px; }
.wiki-body { padding: 32px 36px; color: var(--gui-text); font-size: 7.5px; line-height: 2.4; overflow-wrap: break-word; }
.wiki-loading { text-align: center; padding: 60px 20px; color: var(--gui-text-dim); font-size: 8px; }
.wiki-loading .spinner {
  display: inline-block; width: 16px; height: 16px;
  border: 3px solid var(--gui-border); border-top-color: var(--gui-accent);
  border-radius: 0; animation: spin 0.7s linear infinite; margin-bottom: 18px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.md-content h1 { color: var(--gui-accent); font-size: clamp(10px,2.5vw,16px); text-shadow: 2px 2px 0 var(--gui-bg-dark); margin: 0 0 20px 0; padding-bottom: 10px; border-bottom: 4px solid var(--gui-border); letter-spacing: 1px; line-height: 1.8; scroll-margin-top: 170px; }
.md-content h2 { color: var(--gui-accent); font-size: clamp(8px,1.8vw,12px); text-shadow: 2px 2px 0 var(--gui-bg-dark); margin: 28px 0 14px 0; padding-bottom: 6px; border-bottom: 3px solid var(--gui-border); letter-spacing: 1px; line-height: 1.8; scroll-margin-top: 170px; }
.md-content h3 { color: #ffb84d; font-size: clamp(7px,1.4vw,10px); margin: 20px 0 10px 0; letter-spacing: 1px; line-height: 1.8; scroll-margin-top: 170px; }
.md-content p { margin-bottom: 14px; font-size: 7.5px; line-height: 2.4; color: var(--gui-text); }
.md-content ul, .md-content ol { margin: 10px 0 16px 20px; }
.md-content li { font-size: 7.5px; line-height: 2.4; margin-bottom: 6px; color: var(--gui-text); }
.md-content li::marker { color: var(--gui-accent); }
.md-content code { background: var(--gui-bg-dark); border: 2px solid var(--gui-border); padding: 1px 6px; font-size: 7px; color: #a0ffb8; font-family: 'Press Start 2P', cursive; }
.md-content pre { background: var(--gui-bg-dark); border: 3px solid var(--gui-border); padding: 16px; overflow-x: auto; margin: 14px 0; }
.md-content pre code { background: none; border: none; padding: 0; font-size: 7px; color: #a0ffb8; }
.md-content blockquote { border-left: 4px solid var(--gui-accent); padding-left: 16px; margin: 12px 0; color: var(--gui-text-dim); }
.md-content a { color: var(--gui-accent); text-decoration: underline; }
.md-content a:hover { color: #fff; }
.md-content hr { border: none; height: 4px; background: repeating-linear-gradient(90deg,var(--gui-border) 0px,var(--gui-border) 8px,transparent 8px,transparent 16px); margin: 20px 0; }
.md-content img { max-width: 100%; image-rendering: pixelated; border: 3px solid var(--gui-border); }
.md-content table { border-collapse: collapse; width: 100%; margin: 14px 0; font-size: 7px; }
.md-content th { background: var(--gui-bg-dark); color: var(--gui-accent); padding: 8px 12px; border: 2px solid var(--gui-border); text-align: left; }
.md-content td { padding: 8px 12px; border: 2px solid var(--gui-border); color: var(--gui-text); }
.md-content tr:nth-child(even) td { background: rgba(0,0,0,0.15); }
.btn-back {
  font-family: 'Press Start 2P', cursive; font-size: 8px; padding: 10px 16px;
  background: var(--gui-bg-dark); border: 3px solid var(--gui-accent); color: var(--gui-accent);
  cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 8px;
  box-shadow: 3px 3px 0 #1a0e04;
  clip-path: polygon(0% 4px,4px 4px,4px 0%,calc(100% - 4px) 0%,calc(100% - 4px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 4px),0% calc(100% - 4px));
  transition: filter 0.1s;
}
.btn-back:hover { filter: brightness(1.25); }
.btn-back:active { transform: translate(2px,2px); }

@media (max-width: 600px) {
  .nav-btn { padding: 12px 10px; gap: 0; }
  .nav-label { display: none; }
  .nav-icon { width: 20px; height: 20px; }
  .top-header { gap: 8px; padding-top: 12px; }
  .game-icon { width: 44px; height: 44px; }
  .title { font-size: clamp(11px, 3.5vw, 15px); }
  .wiki-layout { margin-top: 118px; }
  .md-content h1, .md-content h2, .md-content h3 { scroll-margin-top: 130px; }
  .wiki-body { padding: 18px 16px; }
  .wiki-title-bar { flex-wrap: wrap; gap: 8px; }
  .btn-back { font-size: 7px; padding: 8px 12px; }
}
</style>
</head>
<body>
<div class="header-fade"></div>
<div class="clouds">
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="cloud c3"></div>
  <div class="cloud c4"></div>
</div>
<div class="top-header">
  <div class="logo-row">
    <img src="./game/Assets/Icons/icon.png" class="game-icon" alt="icon"/>
    <div class="title">ISOMETRIC ISLAND</div>
  </div>
  <nav class="nav-bar">
    <a class="nav-btn" href="./index.html"><img src="./game/Assets/Icons/Software.png" class="nav-icon" alt=""/> <span class="nav-label">OVERVIEW</span></a>
    <a class="nav-btn nav-btn-active" href="./wiki.html"><img src="./game/Assets/Icons/book.png" class="nav-icon" alt=""/> <span class="nav-label">WIKI</span></a>
    <button class="nav-btn" onclick="alert('Go to the overview page for Changelog.')"><img src="./game/Assets/Icons/maintenance.png" class="nav-icon" alt=""/> <span class="nav-label">CHANGELOG</span></button>
    <button class="nav-btn" onclick="alert('Go to the overview page for Licenses.')"><img src="./game/Assets/Icons/Credit.png" class="nav-icon" alt=""/> <span class="nav-label">LICENSES</span></button>
    <a class="nav-btn" href="#" onclick="alert('No download package configured yet.');return false;"><img src="./game/Assets/Icons/todorm.png" class="nav-icon" alt=""/> <span class="nav-label">DOWNLOAD</span></a>
  </nav>
</div>
<div class="wiki-layout">
  <div class="wiki-page">
    <div class="wiki-title-bar">
      <span>WIKI</span>
      <a href="./index.html" class="btn-back">&#8592; Back to the Main Page</a>
    </div>
    <div class="wiki-body">
      <div id="wiki-content">
        <div class="wiki-loading">
          <div class="spinner"></div>
          <p>We are searchin' for Adrian's secret files, wait a second... We will be as fast as possible, we promise!</p>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
let headingIdCounter = {};
function slugify(text) {
  return text.toLowerCase().replace(/[^\w\s-]/g,'').replace(/\s+/g,'-').replace(/-+/g,'-').trim();
}
function makeId(text) {
  const base = slugify(text);
  headingIdCounter[base] = (headingIdCounter[base] || 0) + 1;
  return headingIdCounter[base] === 1 ? base : base + '-' + headingIdCounter[base];
}
function parseMarkdown(md) {
  headingIdCounter = {};
  const escHtml = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  let lines = md.split('\n'), html = '', i = 0;
  while (i < lines.length) {
    let line = lines[i];
    if (/^```/.test(line)) {
      i++; let code = '';
      while (i < lines.length && !/^```/.test(lines[i])) { code += escHtml(lines[i]) + '\n'; i++; }
      html += '<pre><code>' + code + '</code></pre>'; i++; continue;
    }
    const hm = line.match(/^(#{1,6})\s+(.*)/);
    if (hm) {
      const level = hm[1].length, text = inline(hm[2]);
      const plain = hm[2].replace(/[*_`~\[\]]/g,''), id = makeId(plain);
      const tag = level <= 2 ? 'h' + level : 'h3';
      html += '<' + tag + ' id="' + id + '">' + text + '</' + tag + '>'; i++; continue;
    }
    if (/^---+$/.test(line.trim()) || /^\*\*\*+$/.test(line.trim())) { html += '<hr/>'; i++; continue; }
    if (/^>\s?/.test(line)) {
      let bq = '';
      while (i < lines.length && /^>\s?/.test(lines[i])) { bq += inline(lines[i].replace(/^>\s?/,'')) + '<br/>'; i++; }
      html += '<blockquote>' + bq + '</blockquote>'; continue;
    }
    if (/^[\*\-]\s/.test(line)) {
      html += '<ul>';
      while (i < lines.length && /^[\*\-]\s/.test(lines[i])) { html += '<li>' + inline(lines[i].replace(/^[\*\-]\s/,'')) + '</li>'; i++; }
      html += '</ul>'; continue;
    }
    if (/^\d+\.\s/.test(line)) {
      html += '<ol>';
      while (i < lines.length && /^\d+\.\s/.test(lines[i])) { html += '<li>' + inline(lines[i].replace(/^\d+\.\s/,'')) + '</li>'; i++; }
      html += '</ol>'; continue;
    }
    if (line.trim() === '') { i++; continue; }
    let para = '';
    while (i < lines.length && lines[i].trim() !== '' && !/^[#>\-\*]/.test(lines[i]) && !/^\d+\./.test(lines[i]) && !/^```/.test(lines[i])) {
      para += (para ? ' ' : '') + lines[i]; i++;
    }
    if (para) html += '<p>' + inline(para) + '</p>';
  }
  return html;
}
function inline(text) {
  text = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  text = text.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, function(_, alt, src) {
    if (/^https?:\/\//i.test(src)) return '<img src="' + src + '" alt="' + alt + '"/>';
    const base = 'https://raw.githubusercontent.com/Adium1000/Isometric-island/main/';
    return '<img src="' + base + src.replace(/^\.?\//,'') + '" alt="' + alt + '"/>';
  });
  text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  text = text.replace(/\*\*\*(.+?)\*\*\*/g,'<strong><em>$1</em></strong>');
  text = text.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  text = text.replace(/__(.+?)__/g,'<strong>$1</strong>');
  text = text.replace(/\*(.+?)\*/g,'<em>$1</em>');
  text = text.replace(/_(.+?)_/g,'<em>$1</em>');
  text = text.replace(/`([^`]+)`/g,'<code>$1</code>');
  text = text.replace(/~~(.+?)~~/g,'<del>$1</del>');
  return text;
}
async function loadWiki() {
  const container = document.getElementById('wiki-content');
  try {
    const res = await fetch('https://raw.githubusercontent.com/Adium1000/Isometric-island/main/readme.md', { cache: 'no-cache' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const md = await res.text();
    container.innerHTML = '<div class="md-content">' + parseMarkdown(md) + '</div>';
  } catch (err) {
    container.innerHTML = '<div class="wiki-loading"><p style="color:#ff8080;margin-bottom:16px;">&#9888; Failed to load Wiki, this is your chance! blame Adrian !</p><p style="color:var(--gui-text-dim);font-size:6px;line-height:2.5;">' + err.message + '<br/><br/>Check your connection or visit the<br/><a href="https://github.com/Adium1000/Isometric-island/blob/main/readme.md" target="_blank" style="color:var(--gui-accent);">GitHub page directly</a>.</p></div>';
  }
}
loadWiki();
(function() {
  const fade = document.querySelector('.header-fade');
  window.addEventListener('scroll', function() {
    fade.classList.toggle('visible', window.scrollY > 10);
  }, { passive: true });
})();
</script>
</body>
</html>
